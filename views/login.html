<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Camp - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../public/css/style.css">
</head>

<body>

    <div class="container-fluid login-container">
        <div class="row w-100 m-0">
            <!-- Left Side Image -->
            <div class="col-lg-6 d-none d-lg-block image-side"
                style="background-image: url('../public/images/bg.jpg');">
                <!-- Overlay and Text -->
                <div class="overlay"></div>
                <div class="image-text">
                    <h2>Give Blood, Save Lives</h2>
                    <p>Join our mission to ensure safe blood for everyone. Every drop counts.</p>
                </div>
            </div>

            <!-- Right Side Form -->
            <div class="col-lg-6 col-12 form-side d-flex align-items-center justify-content-center">
                <div class="login-card w-100" style="max-width: 420px;">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-hand-holding-droplet text-danger" style="font-size: 3.5rem;"></i>
                        <h3 class="mt-3 fw-bold">Camp Portal Login</h3>
                        <p class="text-muted">Enter your credentials to access the dashboard.</p>
                    </div>

                    <form id="loginForm">
                        <div id="alertMessage" class="alert d-none" role="alert"></div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <label for="email"><i class="fa-solid fa-envelope me-2 text-muted"></i>Email address</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password"><i class="fa-solid fa-lock me-2 text-muted"></i>Password</label>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-3 btn-login fw-bold fs-5">
                            Log In <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS (Model & Controller) -->
    <script src="../models/UserModel.js"></script>
    <script src="../controllers/loginController.js"></script>

</body>

</html>
